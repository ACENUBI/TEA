      const d=await r.json();

            <div>

                      <div style={{fontWeight:500,fontSize:15}}>{b.nombre}</div>
                      {sc.p>0&&<div style={{fontSize:11,opacity:0.82}}>Compatibilidad: {sc.p}% · Vulnerabilidad: {b.vuln}</div>}
                    </div>
                  </div>
                  <div style={{padding:18,display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
                    <div>
                      <div style={{fontSize:10.5,fontWeight:600,color:"#5F5E5A",textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}}>Intervenciones prioritarias</div>
                      {b.interv.map((iv,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:7}}>
                          <div style={{width:18,height:18,background:C2.a,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}><span style={{color:"#fff",fontSize:9,fontWeight:700}}>{i+1}</span></div>
                          <span style={{fontSize:12.5,color:"#374151",lineHeight:1.4}}>{iv}</span>
                        </div>
                      ))}
                    </div>
                    <div>
                      <div style={{fontSize:10.5,fontWeight:600,color:"#5F5E5A",textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}}>Marcadores a solicitar</div>
                      {b.marcadores.map((m,i)=><div key={i} style={{fontSize:12,color:"#374151",marginBottom:5,padding:"4px 8px",background:"#f9f8f6",borderRadius:6,border:"1px solid #E8E6DF"}}>🧪 {m}</div>)}
                      <div style={{marginTop:10,padding:10,background:C2.bg,borderRadius:8,fontSize:12,color:C2.m,fontWeight:500,border:`1px solid ${C2.a}33`}}>Vulnerabilidad al exposoma: <strong>{b.vuln}</strong></div>
                    </div>
                  </div>
                </div>
              );
            })}
            <div style={{background:"#fff",borderRadius:12,border:"1px solid #D3D1C7",padding:18}}>
              <div style={{fontSize:14,fontWeight:500,color:"#2C2C2A",marginBottom:14}}>💊 Suplementos relevantes para el perfil</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:10}}>
                {SUPL.filter(s=>topB.length===0?s.fase===1:topB.some(tb=>s.bios.includes(tb.id))).sort((a,b)=>a.fase-b.fase).map(s=>{
                  const ev=evC(s.ev);const fa=faseC(s.fase);
                  return(
                    <div key={s.id} style={{border:"1px solid #D3D1C7",borderRadius:8,padding:12,background:"#fafaf9"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:7}}>
                        <div style={{fontWeight:500,fontSize:13,color:"#1e293b",flex:1}}>{s.n}</div>
                        <div style={{display:"flex",gap:3,flexShrink:0,marginLeft:6}}><Bdg bg={fa.bg} color={fa.c}>{fa.l}</Bdg><Bdg bg={ev.bg} color={ev.c}>{ev.l}</Bdg></div>
                      </div>
                      <div style={{fontSize:11.5,color:"#5F5E5A",marginBottom:3}}>Ped: {s.ped}</div>
                      <div style={{fontSize:11.5,color:"#5F5E5A",marginBottom:5}}>{s.timing}</div>
                      <div style={{display:"flex",gap:3}}>{BIOTIPOS.filter(b=>s.bios.includes(b.id)).map(b=><span key={b.id} title={b.nombre} style={{fontSize:14}}>{EMO[b.id]}</span>)}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* ═══════════ TAB SUPLEMENTOS ═══════════ */}
        {tab==="suplementos"&&(
          <div>
            <h1 style={{fontSize:18,fontWeight:500,color:"#2C2C2A",margin:"0 0 4px"}}>Base de datos de suplementos</h1>
            <p style={{fontSize:12.5,color:"#5F5E5A",margin:"0 0 16px"}}>Fichas clínicas completas con forma óptima, dosis, mecanismo, monitoreo e interacciones. [DR]</p>
            <div style={{background:"#fff",borderRadius:10,padding:12,marginBottom:14,display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",border:"1px solid #D3D1C7"}}>
              <div style={{position:"relative",flex:1,minWidth:160}}>
                <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"#888780",fontSize:14}}>🔍</span>
                <input value={ss} onChange={e=>setSs(e.target.value)} placeholder="Buscar suplemento..." style={{width:"100%",border:"1px solid #D3D1C7",borderRadius:8,padding:"7px 10px 7px 28px",fontSize:13,outline:"none",background:"#fff",color:"#2C2C2A",boxSizing:"border-box"}}/>
              </div>
              {[
                [sfev,setSfev,[["all","Toda evidencia"],["alta","Alta"],["media-alta","Media-alta"],["media","Media"]]],
                [sffa,setSffa,[["all","Todas las fases"],["1","Fase 1"],["2","Fase 2"],["3","Fase 3"]]],
                [sfbi,setSfbi,[["all","Todos los biotipos"],...BIOTIPOS.map(b=>[String(b.id),`${EMO[b.id]} ${b.nombre}`])]],
              ].map(([val,set,opts],i)=>(
                <select key={i} value={val} onChange={e=>set(e.target.value)} style={{border:"1px solid #D3D1C7",borderRadius:8,padding:"7px 10px",fontSize:12.5,background:"#fff",color:"#2C2C2A",cursor:"pointer"}}>
                  {opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}
                </select>
              ))}
            </div>
            {SUPL.filter(s=>{
              if(ss&&!s.n.toLowerCase().includes(ss.toLowerCase())&&!s.cat.toLowerCase().includes(ss.toLowerCase()))return false;
              if(sfev!=="all"&&s.ev!==sfev)return false;
              if(sffa!=="all"&&s.fase!==parseInt(sffa))return false;
              if(sfbi!=="all"&&!s.bios.includes(parseInt(sfbi)))return false;
              return true;
            }).map(s=>{
              const ev=evC(s.ev);const fa=faseC(s.fase);const isO=openS===s.id;
              return(
                <div key={s.id} style={{background:"#fff",borderRadius:10,marginBottom:6,border:"1px solid #D3D1C7",overflow:"hidden"}}>
                  <div onClick={()=>setOpenS(isO?null:s.id)} style={{padding:"11px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontSize:13.5,fontWeight:500,color:"#1e293b"}}>{s.n}</span>
                        <Bdg bg={fa.bg} color={fa.c}>{fa.l}</Bdg>
                        <Bdg bg={ev.bg} color={ev.c}>Evidencia {ev.l}</Bdg>
                        <span style={{fontSize:11,color:"#888780"}}>{s.cat}</span>
                      </div>
                      <div style={{fontSize:11,color:"#5F5E5A",marginTop:2}}>{s.forma.substring(0,72)}...</div>
                    </div>
                    <div style={{display:"flex",gap:3,marginRight:8}}>{BIOTIPOS.filter(b=>s.bios.includes(b.id)).map(b=><span key={b.id} title={b.nombre} style={{fontSize:15}}>{EMO[b.id]}</span>)}</div>
                    <span style={{fontSize:12,color:"#888780"}}>{isO?"▲":"▼"}</span>
                  </div>
                  {isO&&(
                    <div style={{padding:"15px 18px",background:"#fafaf9",borderTop:"1px solid #E8E6DF",display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                      <div>
                        <FR label="Forma óptima" val={s.forma}/>
                        <FR label="Dosis pediátrica" val={s.ped}/>
                        <FR label="Dosis adulto" val={s.adulto}/>
                        <FR label="Timing" val={s.timing}/>
                        <FR label="Mecanismo" val={s.mec}/>
                        <FR label="Interacciones" val={s.int}/>
                      </div>
                      <div>
                        <FR label="Monitoreo" val={s.mono}/>
                        <FR label="⚠️ Precauciones" val={s.prec} warn/>
                        <div style={{marginTop:12,padding:10,background:"#F1EFE8",borderRadius:8,border:"1px solid #D3D1C7"}}>
                          <div style={{fontSize:10.5,fontWeight:600,color:"#5F5E5A",marginBottom:6,textTransform:"uppercase",letterSpacing:0.4}}>Biotipos relevantes</div>
                          <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                            {BIOTIPOS.filter(b=>s.bios.includes(b.id)).map(b=>{const C2=BCLR[b.id];return<span key={b.id} style={{fontSize:11,padding:"2px 8px",borderRadius:12,background:C2.bg,color:C2.m,border:`1px solid ${C2.a}33`}}>{EMO[b.id]} {b.nombre}</span>;})}
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* ═══════════ TAB BIOMARCADORES ═══════════ */}
        {tab==="biomarcadores"&&(
          <div>
            <h1 style={{fontSize:18,fontWeight:500,color:"#2C2C2A",margin:"0 0 4px"}}>Panel de biomarcadores y seguimiento</h1>
            <p style={{fontSize:12.5,color:"#5F5E5A",margin:"0 0 16px"}}>[DR] — Panel clínico integrado para monitorear la respuesta al protocolo y la carga del exposoma.</p>
            <div style={{background:"#fff",borderRadius:10,padding:12,marginBottom:14,display:"flex",gap:10,flexWrap:"wrap",border:"1px solid #D3D1C7"}}>
              <div style={{position:"relative",flex:1,minWidth:160}}>
                <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"#888780"}}>🔍</span>
                <input value={bsq} onChange={e=>setBsq(e.target.value)} placeholder="Buscar biomarcador..." style={{width:"100%",border:"1px solid #D3D1C7",borderRadius:8,padding:"7px 10px 7px 28px",fontSize:13,outline:"none",background:"#fff",color:"#2C2C2A",boxSizing:"border-box"}}/>
              </div>
              <select value={bcat} onChange={e=>setBcat(e.target.value)} style={{border:"1px solid #D3D1C7",borderRadius:8,padding:"7px 10px",fontSize:12.5,background:"#fff",color:"#2C2C2A",cursor:"pointer"}}>
                <option value="all">Todas las categorías</option>
                {[...new Set(BMARK.map(b=>b.cat))].map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(360px,1fr))",gap:12}}>
              {BMARK.filter(b=>{
                if(bsq&&!b.n.toLowerCase().includes(bsq.toLowerCase()))return false;
                if(bcat!=="all"&&b.cat!==bcat)return false;
                return true;
              }).map(b=>(
                <div key={b.id} style={{background:"#fff",borderRadius:10,border:"1px solid #D3D1C7",padding:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                    <div style={{fontWeight:500,fontSize:13,color:"#1e293b",flex:1,marginRight:8}}>{b.n}</div>
                    <Bdg bg="#F1EFE8" color="#5F5E5A" size={10}>{b.cat}</Bdg>
                  </div>
                  <div style={{marginBottom:10}}>
                    <div style={{display:"flex",height:14,borderRadius:4,overflow:"hidden",marginBottom:3}}>
                      <div style={{flex:1,background:"#FCEBEB",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,color:"#A32D2D",fontWeight:600}}>DEFICIENTE</div>
                      <div style={{flex:1,background:"#FAEEDA",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,color:"#854F0B",fontWeight:600}}>INSUFICIENTE</div>
                      <div style={{flex:2,background:"#EAF3DE",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,color:"#3B6D11",fontWeight:600}}>ÓPTIMO</div>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 2fr",gap:2,textAlign:"center"}}>
                      <div style={{fontSize:10,color:"#A32D2D"}}>{b.def}</div>
                      <div style={{fontSize:10,color:"#854F0B"}}>{b.insuf}</div>
                      <div style={{fontSize:10,color:"#3B6D11",fontWeight:600}}>{b.opt}</div>
                    </div>
                  </div>
                  <div style={{fontSize:11.5,color:"#5F5E5A",marginBottom:4}}><strong>Muestra:</strong> {b.muestra}</div>
                  <div style={{fontSize:11.5,color:"#5F5E5A",marginBottom:6}}><strong>Frecuencia:</strong> {b.freq}</div>
                  <div style={{fontSize:11,color:"#5F5E5A",background:"#f9f8f6",padding:"5px 8px",borderRadius:6,lineHeight:1.4}}>{b.rel}</div>
                  <div style={{display:"flex",gap:6,marginTop:8}}>
                    <Bdg bg="#F1EFE8" color="#5F5E5A" size={10}>Acceso: {b.acc}</Bdg>
                    <Bdg bg="#F1EFE8" color="#5F5E5A" size={10}>Costo: {b.costo}</Bdg>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ═══════════ TAB PRIORIZACIÓN ═══════════ */}
        {tab==="priorizacion"&&(
          <div>
            <h1 style={{fontSize:18,fontWeight:500,color:"#2C2C2A",margin:"0 0 4px"}}>Matriz de priorización clínica</h1>
            <p style={{fontSize:12.5,color:"#5F5E5A",margin:"0 0 18px"}}>Impacto potencial (1–5) vs. factibilidad/adherencia (1–5). Haz clic en cualquier punto para ver detalles. [P+DR]</p>
            <div style={{background:"#fff",borderRadius:12,border:"1px solid #D3D1C7",padding:20,marginBottom:14}}>
              <div style={{position:"relative",width:"100%",paddingBottom:"44%",borderRadius:8,overflow:"hidden",background:"linear-gradient(to top right,#FCEBEB 0%,#FAEEDA 50%,#EAF3DE 100%)"}}>
                {[{pos:{top:8,left:8},l:"Considerar",bg:"rgba(252,235,235,0.88)",c:"#A32D2D"},{pos:{top:8,right:8},l:"✓ Hacer primero",bg:"rgba(234,243,222,0.88)",c:"#3B6D11"},{pos:{bottom:8,left:8},l:"Evaluar evidencia",bg:"rgba(241,239,232,0.88)",c:"#5F5E5A"},{pos:{bottom:8,right:8},l:"Planificar",bg:"rgba(230,241,251,0.88)",c:"#185FA5"}].map((q,i)=>(
                  <div key={i} style={{position:"absolute",...q.pos,fontSize:10,fontWeight:600,color:q.c,background:q.bg,padding:"2px 7px",borderRadius:4}}>{q.l}</div>
                ))}
                <div style={{position:"absolute",left:"50%",top:0,bottom:0,borderLeft:"1.5px dashed rgba(100,116,139,0.2)",transform:"translateX(-50%)"}}/>
                <div style={{position:"absolute",top:"50%",left:0,right:0,borderTop:"1.5px dashed rgba(100,116,139,0.2)",transform:"translateY(-50%)"}}/>
                {PRIO.map(item=>{
                  const x=((item.fac-1)/4)*82+7;
                  const y=100-((item.imp-1)/4)*82-7;
                  const dotC={A:"#3B6D11",B:"#185FA5",C:"#854F0B",D:"#5F5E5A"}[item.q];
                  const sel=matSel?.id===item.id;
                  return(
                    <div key={item.id} onClick={()=>setMatSel(sel?null:item)} title={item.n}
                      style={{position:"absolute",left:`${x}%`,top:`${y}%`,width:22,height:22,borderRadius:"50%",background:dotC,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#fff",fontWeight:700,border:sel?"2.5px solid #0F2544":"2px solid rgba(255,255,255,0.7)",transform:"translate(-50%,-50%)",zIndex:10,boxShadow:sel?"0 0 0 3px rgba(15,37,84,0.15)":"none"}}>
                      {item.id}
                    </div>
                  );
                })}
                <div style={{position:"absolute",bottom:2,left:"50%",transform:"translateX(-50%)",fontSize:9,color:"rgba(100,116,139,0.6)",fontWeight:600}}>FACTIBILIDAD →</div>
              </div>
              {matSel&&(
                <div style={{marginTop:14,padding:12,background:"#F1EFE8",borderRadius:8,display:"flex",justifyContent:"space-between",alignItems:"flex-start",border:"1px solid #D3D1C7"}}>
                  <div>
                    <div style={{fontWeight:500,fontSize:14,color:"#1e293b"}}>#{matSel.id} {matSel.n}</div>
                    <div style={{fontSize:12,color:"#5F5E5A",marginTop:4}}>Impacto: {matSel.imp}/5 · Factibilidad: {matSel.fac}/5 · Costo: {matSel.costo} · Evidencia: {matSel.ev}</div>
                  </div>
                  <Bdg bg={qMeta[matSel.q].bg} color={qMeta[matSel.q].c}>{qMeta[matSel.q].l}</Bdg>
                </div>
              )}
            </div>
            <div style={{background:"#fff",borderRadius:12,border:"1px solid #D3D1C7",overflow:"hidden"}}>
              <div style={{padding:"10px 16px",background:"#F1EFE8",borderBottom:"1px solid #D3D1C7",display:"grid",gridTemplateColumns:"28px 1fr 80px 80px 80px 80px 130px",gap:8,fontSize:10,fontWeight:600,color:"#5F5E5A",textTransform:"uppercase",letterSpacing:0.4}}>
                <div>#</div><div>Intervención</div><div>Impacto</div><div>Factibilidad</div><div>Costo</div><div>Evidencia</div><div>Cuadrante</div>
              </div>
              {[...PRIO].sort((a,b)=>(b.imp+b.fac)-(a.imp+a.fac)).map(item=>(
                <div key={item.id} onClick={()=>setMatSel(matSel?.id===item.id?null:item)}
                  style={{padding:"8px 16px",borderBottom:"1px solid #F1EFE8",display:"grid",gridTemplateColumns:"28px 1fr 80px 80px 80px 80px 130px",gap:8,alignItems:"center",fontSize:12.5,cursor:"pointer",background:matSel?.id===item.id?"#F1EFE8":"#fff",transition:"background 0.1s"}}>
                  <div style={{color:"#888780",fontWeight:500,fontSize:11}}>{item.id}</div>
                  <div style={{fontWeight:500,color:"#1e293b"}}>{item.n}</div>
                  <div style={{color:"#EF9F27",fontSize:13}}>{"★".repeat(item.imp)}{"☆".repeat(5-item.imp)}</div>
                  <div style={{color:"#EF9F27",fontSize:13}}>{"★".repeat(item.fac)}{"☆".repeat(5-item.fac)}</div>
                  <div style={{color:"#5F5E5A",fontSize:11.5}}>{item.costo}</div>
                  <div style={{color:"#5F5E5A",fontSize:11.5}}>{item.ev}</div>
                  <div><Bdg bg={qMeta[item.q].bg} color={qMeta[item.q].c} size={10}>{qMeta[item.q].l}</Bdg></div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ═══════════ TAB TIMELINE ═══════════ */}
        {tab==="timeline"&&(
          <div>
            <h1 style={{fontSize:18,fontWeight:500,color:"#2C2C2A",margin:"0 0 4px"}}>Timeline de intervención</h1>
            <p style={{fontSize:12.5,color:"#5F5E5A",margin:"0 0 18px"}}>Protocolo secuencial por fases temporales. [DR] — Basado en coherencia mecanística con el marco exposoma del paper.</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:14,marginBottom:16}}>
              {PHASES.map(ph=>(
                <div key={ph.id} style={{background:"#fff",borderRadius:12,border:"1px solid #D3D1C7",overflow:"hidden"}}>
                  <div style={{background:ph.clr,color:"#fff",padding:"11px 15px"}}>
                    <div style={{fontWeight:500,fontSize:15}}>{ph.titulo}</div>
                    <div style={{fontSize:11,opacity:0.82,marginTop:1}}>{ph.sub}</div>
                  </div>
                  <div style={{padding:"8px 12px",background:ph.lt,borderBottom:`1px solid ${ph.clr}33`}}>
                    <div style={{fontSize:9.5,fontWeight:600,color:ph.clr,textTransform:"uppercase",letterSpacing:0.4}}>Hito de evaluación</div>
                    <div style={{fontSize:11.5,color:"#374151",marginTop:2,lineHeight:1.4}}>{ph.hito}</div>
                  </div>
                  <div style={{padding:13}}>
                    {ph.items.map((item,i)=>{const tc=tpC[item.tp];return(
                      <div key={i} style={{display:"flex",alignItems:"flex-start",gap:7,marginBottom:6}}>
                        <span style={{fontSize:9,padding:"2px 5px",borderRadius:8,background:tc.bg,color:tc.c,fontWeight:600,whiteSpace:"nowrap",marginTop:1.5,flexShrink:0}}>{tc.l}</span>
                        <span style={{fontSize:11.5,color:"#374151",lineHeight:1.35}}>{item.t}</span>
                      </div>
                    );})}
                  </div>
                </div>
              ))}
            </div>
            <div style={{background:"#fff",borderRadius:10,border:"1px solid #D3D1C7",padding:"11px 16px",marginBottom:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:12,fontWeight:500,color:"#5F5E5A"}}>Leyenda:</span>
              {Object.entries(tpC).map(([k,v])=><Bdg key={k} bg={v.bg} color={v.c}>{v.l}</Bdg>)}
            </div>
            <div style={{background:"#FCEBEB",borderRadius:10,border:"1px solid #F7C1C1",padding:"14px 18px"}}>
              <div style={{fontSize:13,fontWeight:500,color:"#A32D2D",marginBottom:8}}>⚠️ Señales de alerta durante el protocolo</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:7}}>
                {["Empeoramiento agudo del sueño → revisar 5-MTHF (posible COMT lento)","Irritabilidad nueva → verificar dosis de Zinc y Mg","Diarrea severa >3 días → reducir probióticos o cambiar forma de Mg","Reacción alérgica → suspender el último suplemento añadido","Empeoramiento con metilfolato → cambiar a folinato de calcio","Die-off transitorio (<14 días) → reducir dosis temporalmente"].map((w,i)=>(
                  <div key={i} style={{fontSize:12,color:"#501313",padding:"5px 9px",background:"rgba(255,255,255,0.55)",borderRadius:6,lineHeight:1.4}}>• {w}</div>
                ))}
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
